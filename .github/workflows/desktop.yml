name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the desktop app
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: compcreator-${{ matrix.os }}
          path: dist/CompCreator-*.zip
          if-no-files-found: error
