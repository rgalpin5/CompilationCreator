name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/desktop.yml"
      - "packaging/**"
      - "backend/**"
      - "frontend/**"
      - ".gitattributes"

permissions:
  contents: write

concurrency:
  group: desktop-packages
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the desktop app
        run: python packaging/build.py
      - name: Publish the installer
        shell: bash
        run: |
          git lfs install --local
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/CompCreator-mac.dmg dist/CompCreator-windows.exe
          if git diff --cached --quiet; then
            echo "Installer already matches the repository."
            exit 0
          fi
          git commit -m "Publish the desktop installer built on ${{ runner.os }}."
          for attempt in 1 2 3 4 5; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "Could not publish the installer."
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: compcreator-${{ matrix.os }}
          path: dist/CompCreator-*
          if-no-files-found: error
