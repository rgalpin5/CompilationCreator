name: Desktop packages

on:
  workflow_dispatch:
  # Installers bundle the yt-dlp that was current when they were built. The
  # weekly run rebuilds them only when a newer yt-dlp is out.
  schedule:
    - cron: "0 7 * * 1"
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "packaging/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-packages
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      ytdlp: ${{ steps.check.outputs.ytdlp }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | jq -r .info.version)
          echo "ytdlp=$latest" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          notes=$(gh release view desktop-latest --json body -q .body 2>/dev/null || true)
          if grep -qF "with yt-dlp $latest " <<<"$notes"; then
            echo "desktop-latest already bundles yt-dlp $latest."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "yt-dlp $latest is newer than the published installers."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: freshness
    if: needs.freshness.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the desktop app
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: compcreator-${{ matrix.os }}
          path: |
            dist/CompCreator-mac.dmg
            dist/CompCreator-windows.exe
          if-no-files-found: error

  # Installers go to GitHub Releases instead of git, so the repository does not
  # grow by a pair of installers on every build. Pushes to main and manual runs
  # replace the assets on the rolling desktop-latest release; a v* tag also gets
  # its own release. The weekly run publishes there too when it rebuilt.
  release:
    needs: [freshness, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      YTDLP: ${{ needs.freshness.outputs.ytdlp }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish to the rolling release
        shell: bash
        run: |
          set -euo pipefail
          tag=desktop-latest
          # The weekly run reads the yt-dlp version back from these notes.
          notes="Built from ${GITHUB_SHA::7} with yt-dlp ${YTDLP} by run ${GITHUB_RUN_ID}."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" \
              --title "Desktop app (latest build)" --notes "$notes" --latest=false
          fi
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit "$tag" --notes "$notes"
          gh release upload "$tag" installers/* --clobber
      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            gh release create "$tag" installers/* --verify-tag \
              --title "CompCreator $tag" --generate-notes
          fi
